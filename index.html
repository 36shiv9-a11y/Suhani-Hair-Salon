<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suhani Hair Salon | Bhopal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hero-bg { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=1200'); background-size: cover; }
        .fade-out { transition: opacity 1.5s; opacity: 0; }
        .booking-active { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-slate-100 font-sans">

    <nav class="bg-black text-white p-5 text-center sticky top-0 z-50 border-b-4 border-amber-600 shadow-xl">
        <h1 class="text-3xl font-black text-amber-500 italic uppercase">SUHANI HAIR SALON</h1>
        <p class="text-[10px] text-gray-400 tracking-widest font-bold">Kolar Road, Bhopal | Established 2007</p>
    </nav>

    <main class="max-w-6xl mx-auto py-8 px-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white rounded-xl shadow overflow-hidden border-b-4 border-amber-500">
                <img src="https://images.unsplash.com/photo-1599351431247-f10b21816381?q=80&w=400" class="w-full h-40 object-cover">
                <p class="p-2 text-center font-bold text-sm uppercase">Hair Cutting</p>
            </div>
            <div class="bg-white rounded-xl shadow overflow-hidden border-b-4 border-slate-800">
                <img src="https://images.unsplash.com/photo-1621605815841-28d9447ad2b1?q=80&w=400" class="w-full h-40 object-cover">
                <p class="p-2 text-center font-bold text-sm uppercase">Beard Styling</p>
            </div>
            <div class="bg-white rounded-xl shadow overflow-hidden border-b-4 border-amber-500">
                <img src="https://images.unsplash.com/photo-1512496011212-72d20b307445?q=80&w=400" class="w-full h-40 object-cover">
                <p class="p-2 text-center font-bold text-sm uppercase">Face Facial</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-3xl shadow-xl border border-blue-100">
                <h3 class="text-2xl font-black mb-4 text-blue-800 uppercase italic">Waiting List</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <tr class="bg-slate-100 font-bold text-[10px] uppercase tracking-tighter">
                            <th class="p-3 border">Grahak</th>
                            <th class="p-3 border">Samay</th>
                            <th class="p-3 border">Status</th>
                        </tr>
                        <tbody id="liveList">
                            <tr id="noBooking"><td class="p-8 text-center text-gray-400 italic" colspan="3">Abhi seat khali hai!</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-amber-50 p-6 rounded-3xl shadow-xl border-2 border-amber-200">
                <h3 class="text-2xl font-black text-center mb-6 text-slate-900 uppercase italic">Appointment Lein</h3>
                <div class="space-y-4">
                    <input type="text" id="custName" placeholder="Apna Naam" class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-amber-500 shadow-inner">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="custDate" class="w-full p-4 border rounded-xl outline-none">
                        <input type="time" id="custTime" class="w-full p-4 border rounded-xl outline-none">
                    </div>
                    <button onclick="bookMySeat()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-green-700 flex items-center justify-center gap-2 uppercase">
                        <i class="fab fa-whatsapp text-2xl"></i> WhatsApp Booking
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white p-10 mt-10 text-center border-t-4 border-amber-600">
        <p class="text-amber-500 font-bold uppercase italic">Suhani Hair Salon</p>
        <p class="text-[10px] text-gray-500 mt-2">Shop 01, Kolar Road, Bhopal | Call: +91 99778-51389</p>
    </footer>

    <script>
        function bookMySeat() {
            var name = document.getElementById('custName').value;
            var date = document.getElementById('custDate').value;
            var time = document.getElementById('custTime').value;
            var phone = "919977851389";

            if(!name || !date || !time) {
                alert("Kripya saari jankari bharein!");
                return;
            }

            // List mein naam jodein
            var list = document.getElementById('liveList');
            var empty = document.getElementById('noBooking');
            if(empty) empty.remove();

            var rowId = "row-" + Date.now();
            var newRow = document.createElement("tr");
            newRow.id = rowId;
            newRow.className = "border-b font-bold text-slate-800";
            newRow.innerHTML = `<td class="p-3 text-xs uppercase">${name}</td><td class="p-3 text-blue-600">${time}</td><td class="p-3"><span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] booking-active">SERVICE...</span></td>`;
            list.appendChild(newRow);

            // 20 Minute Timer (1200000ms)
            setTimeout(function() {
                var el = document.getElementById(rowId);
                if(el) {
                    el.classList.add('fade-out');
                    setTimeout(function() { el.remove(); }, 1500);
                }
            }, 1200000);

            // WhatsApp link
            var msg = "*New Appointment*%0A*Naam:* " + name + "%0A*Time:* " + time + "%0A*Date:* " + date;
            window.open("https://wa.me/" + phone + "?text=" + msg, '_blank');
        }
    </script>
</body>
</html>
